{% extends 'base.html' %}
{% block title %}Login — MRP Lite{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height:100vh; background:#1a1f2e;">
  <div class="card shadow-lg" style="width:380px; border-radius:12px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-box-seam fs-1 text-primary"></i>
        <h4 class="mt-2 fw-bold">MRP Lite</h4>
        <p class="text-muted small">Manufacturing Resource Planning</p>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" autofocus required/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
