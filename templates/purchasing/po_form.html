{% extends 'base.html' %}
{% block title %}New Purchase Order{% endblock %}
{% block page_title %}Purchasing — New Purchase Order{% endblock %}

{% block content %}
<div class="card" style="max-width:900px;">
  <div class="card-header fw-semibold">New Purchase Order</div>
  <div class="card-body">
    <form method="POST" id="poForm">
      <div class="row g-3 mb-3">
        <div class="col-md-5">
          <label class="form-label fw-semibold">Supplier *</label>
          <select name="supplier_id" class="form-select" required>
            <option value="">— Select Supplier —</option>
            {% for s in suppliers %}
            <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label fw-semibold">Expected Delivery</label>
          <input type="date" name="expected_date" class="form-control"/>
        </div>
        <div class="col-md-4">
          <label class="form-label">Notes</label>
          <input type="text" name="notes" class="form-control" placeholder="Optional"/>
        </div>
      </div>

      <h6 class="fw-semibold mt-4 mb-2">Order Lines</h6>
      <table class="table table-sm" id="linesTable">
        <thead class="table-light">
          <tr><th>Material</th><th style="width:110px">Qty</th><th style="width:130px">Unit Price £</th><th style="width:40px"></th></tr>
        </thead>
        <tbody id="linesBody">
          <tr class="line-row">
            <td>
              <select name="material_id[]" class="form-select form-select-sm material-select">
                <option value="">— Select Material —</option>
                {% for m in materials %}
                <option value="{{ m.id }}" data-price="{{ m.cost_price }}">{{ m.code }} — {{ m.name }}</option>
                {% endfor %}
              </select>
            </td>
            <td><input type="number" name="qty[]" class="form-control form-control-sm" min="0.001" step="0.001" value="1"/></td>
            <td><input type="number" name="unit_price[]" class="form-control form-control-sm price-field" min="0" step="0.01"/></td>
            <td><button type="button" class="btn btn-sm btn-outline-danger remove-line">✕</button></td>
          </tr>
        </tbody>
      </table>
      <button type="button" class="btn btn-outline-secondary btn-sm mb-3" id="addLine">
        <i class="bi bi-plus-lg me-1"></i>Add Line
      </button>

      <div class="d-flex gap-2 mt-3">
        <button type="submit" class="btn btn-primary fw-semibold">Create Purchase Order</button>
        <a href="{{ url_for('purchasing.po_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const rowTemplate = document.querySelector('.line-row').outerHTML;

document.getElementById('addLine').addEventListener('click', () => {
  document.getElementById('linesBody').insertAdjacentHTML('beforeend', rowTemplate);
  attachHandlers();
});

function attachHandlers() {
  document.querySelectorAll('.material-select').forEach(sel => {
    sel.onchange = function() {
      const opt = this.options[this.selectedIndex];
      const price = opt.dataset.price || '';
      this.closest('tr').querySelector('.price-field').value = price;
    };
  });
  document.querySelectorAll('.remove-line').forEach(btn => {
    btn.onclick = function() {
      const rows = document.querySelectorAll('.line-row');
      if (rows.length > 1) this.closest('tr').remove();
    };
  });
}
attachHandlers();
</script>
{% endblock %}
