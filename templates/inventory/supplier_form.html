{% extends 'base.html' %}
{% block title %}{{ 'Edit' if supplier else 'Add' }} Supplier{% endblock %}
{% block page_title %}{{ 'Edit' if supplier else 'Add' }} Supplier{% endblock %}

{% block content %}
<div class="card" style="max-width:560px;">
  <div class="card-header fw-semibold">
    {{ 'Edit — ' + supplier.name if supplier else 'New Supplier' }}
  </div>
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Company Name *</label>
        <input type="text" name="name" class="form-control" required
               value="{{ supplier.name if supplier else '' }}"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Contact Person</label>
        <input type="text" name="contact" class="form-control"
               value="{{ supplier.contact if supplier else '' }}"/>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control"
                 value="{{ supplier.email if supplier else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control"
                 value="{{ supplier.phone if supplier else '' }}"/>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea name="address" class="form-control" rows="4"
                  placeholder="Street&#10;Town&#10;City&#10;Postcode">{{ supplier.address if supplier else '' }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Lead Time (days)</label>
        <input type="number" name="lead_time_days" class="form-control" min="1"
               value="{{ supplier.lead_time_days if supplier else 7 }}" style="width:120px;"/>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary fw-semibold">
          {{ 'Save Changes' if supplier else 'Add Supplier' }}
        </button>
        <a href="{{ url_for('inventory.suppliers_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
