{% extends 'base.html' %}
{% block title %}{{ 'Edit' if customer else 'Add' }} Customer{% endblock %}
{% block page_title %}{{ 'Edit' if customer else 'Add' }} Customer{% endblock %}

{% block content %}
<div class="card" style="max-width:560px;">
  <div class="card-header fw-semibold">
    {{ 'Edit — ' + customer.name if customer else 'New Customer' }}
  </div>
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label fw-semibold">Company / Customer Name *</label>
        <input type="text" name="name" class="form-control" required
               value="{{ customer.name if customer else '' }}"/>
      </div>
      <div class="mb-3">
        <label class="form-label">Contact Person</label>
        <input type="text" name="contact" class="form-control"
               value="{{ customer.contact if customer else '' }}"/>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control"
                 value="{{ customer.email if customer else '' }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control"
                 value="{{ customer.phone if customer else '' }}"/>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Address</label>
        <textarea name="address" class="form-control" rows="3">{{ customer.address if customer else '' }}</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Payment Terms</label>
        <select name="payment_terms" class="form-select">
          {% set terms = customer.payment_terms if customer else '30 days Nett' %}
          <option value="Pro Forma" {% if terms == 'Pro Forma' %}selected{% endif %}>Pro Forma</option>
          <option value="30 days Nett" {% if terms == '30 days Nett' %}selected{% endif %}>30 days Nett</option>
          <option value="60 days from invoice date" {% if terms == '60 days from invoice date' %}selected{% endif %}>60 days from invoice date</option>
        </select>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary fw-semibold">
          {{ 'Save Changes' if customer else 'Add Customer' }}
        </button>
        <a href="{{ url_for('inventory.customers_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
